<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720"
  font-family="Segoe UI, Selawik, 'Open Sans', sans-serif">
  <title>xost</title>
  <defs>
    <!-- The sky and floor of the 2008 dashboard's channels, its colours measured from a capture. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#284607"/>
      <stop offset="0.2" stop-color="#4B7218"/>
      <stop offset="0.42" stop-color="#7E9D4E"/>
      <stop offset="0.58" stop-color="#A2B2A2"/>
      <stop offset="0.7" stop-color="#B2BCB6"/>
    </linearGradient>
    <linearGradient id="haze" x1="300" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8B80" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C8B80" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9BEC7"/>
      <stop offset="0.45" stop-color="#9297A0"/>
      <stop offset="1" stop-color="#5E6068"/>
    </linearGradient>
    <linearGradient id="floor-shade" x1="0" y1="400" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E4046" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E4046" stop-opacity="0.45"/>
    </linearGradient>
    <!-- A slot: bright lime under its top edge, olive at its foot. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FE9C"/>
      <stop offset="0.04" stop-color="#ECFD72"/>
      <stop offset="0.16" stop-color="#DCFB46"/>
      <stop offset="0.52" stop-color="#9BD815"/>
      <stop offset="0.87" stop-color="#456A13"/>
      <stop offset="1" stop-color="#22350D"/>
    </linearGradient>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0.7" y2="0.8">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1F9D8"/>
      <stop offset="1" stop-color="#D3EA86"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#F2F9DA"/>
      <stop offset="0.72" stop-color="#C9E27C"/>
      <stop offset="1" stop-color="#8DB52C"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="430" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflection-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <rect width="1280" height="720" fill="url(#fade)"/>
    </mask>
    <clipPath id="front-clip"><rect x="96" y="262" width="416" height="315" rx="12"/></clipPath>
    <filter id="text-shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E1A04" flood-opacity="0.45"/>
    </filter>
    <!-- Each slot shades the one behind it. -->
    <filter id="slot-shadow" x="-10%" y="-10%" width="125%" height="120%">
      <feDropShadow dx="6" dy="0" stdDeviation="6" flood-color="#18260A" flood-opacity="0.4"/>
    </filter>
    <filter id="icon-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1C2E06" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="470" fill="url(#haze)"/>
  <path d="M0 452 C400 432 900 408 1280 398 V720 H0 Z" fill="url(#floor)"/>
  <path d="M0 452 C400 432 900 408 1280 398 V720 H0 Z" fill="url(#floor-shade)"/>

  <!-- The channel list: the selected channel large, with its square, and the ones above it fading. -->
  <g fill="#FFF">
    <text x="102" y="141" font-size="38" opacity="0.42">vulkan4xenon</text>
    <g filter="url(#text-shadow)">
      <rect x="78" y="192" width="15" height="15"/>
      <text x="100" y="226" font-size="100" font-weight="600">xost</text>
    </g>
  </g>

  <g mask="url(#reflection-fade)">
    <use href="#slot-5" transform="matrix(1 0 0 -1 0 914)"/><use href="#slot-4" transform="matrix(1 0 0 -1 0 933)"/><use href="#slot-3" transform="matrix(1 0 0 -1 0 965)"/><use href="#slot-2" transform="matrix(1 0 0 -1 0 1003)"/><use href="#slot-1" transform="matrix(1 0 0 -1 0 1059)"/><use href="#slot-0" transform="matrix(1 0 0 -1 0 1154)"/>
  </g>
  <g>
    <g id="slot-5" filter="url(#slot-shadow)"><rect x="1138.1" y="342" width="151.9" height="115" rx="4.4" fill="url(#tile)"/><rect x="1138.1" y="342" width="151.9" height="115" rx="4.4" fill="url(#tile-light)"/><g transform="translate(1248 390.3) scale(0.365)" filter="url(#icon-shadow)"><path d="M0 -44 L46 36 H-46 Z" fill="url(#glyph)" stroke="url(#glyph)" stroke-width="12" stroke-linejoin="round"/></g><rect x="1138.1" y="342" width="151.9" height="115" rx="4.4" fill="none" stroke="#F6FFB0" stroke-opacity="0.35" stroke-width="2"/><rect x="1138.1" y="342" width="151.9" height="115" rx="4.4" fill="#000" opacity="0.15"/></g><g id="slot-4" filter="url(#slot-shadow)"><rect x="1039" y="332.5" width="177" height="134" rx="5.1" fill="url(#tile)"/><rect x="1039" y="332.5" width="177" height="134" rx="5.1" fill="url(#tile-light)"/><g transform="translate(1172 388.8) scale(0.425)" filter="url(#icon-shadow)"><circle cx="-20" r="36" fill="url(#glyph)"/><circle cx="20" r="36" fill="#D6EA94" opacity="0.92"/><path d="M0 -29.9 A36 36 0 0 1 0 29.9 A36 36 0 0 1 0 -29.9 Z" fill="#FFF"/></g><rect x="1039" y="332.5" width="177" height="134" rx="5.1" fill="none" stroke="#F6FFB0" stroke-opacity="0.35" stroke-width="2"/><rect x="1039" y="332.5" width="177" height="134" rx="5.1" fill="#000" opacity="0.12"/></g><g id="slot-3" filter="url(#slot-shadow)"><rect x="914.1" y="320.5" width="213.9" height="162" rx="6.2" fill="url(#tile)"/><rect x="914.1" y="320.5" width="213.9" height="162" rx="6.2" fill="url(#tile-light)"/><g transform="translate(1068 388.5) scale(0.514)" filter="url(#icon-shadow)"><line x1="14" y1="14" x2="46" y2="46" stroke="url(#glyph)" stroke-width="17" stroke-linecap="round"/><circle cx="-10" cy="-10" r="34" fill="#9BC53A" stroke="url(#glyph)" stroke-width="12"/><g fill="#E4F1BC"><rect x="-28" y="-20" width="34" height="7" rx="3"/><rect x="-28" y="-5" width="24" height="7" rx="3"/></g></g><rect x="914.1" y="320.5" width="213.9" height="162" rx="6.2" fill="none" stroke="#F6FFB0" stroke-opacity="0.35" stroke-width="2"/><rect x="914.1" y="320.5" width="213.9" height="162" rx="6.2" fill="#000" opacity="0.09"/></g><g id="slot-2" filter="url(#slot-shadow)"><rect x="754.4" y="309.5" width="253.6" height="192" rx="7.3" fill="url(#tile)"/><rect x="754.4" y="309.5" width="253.6" height="192" rx="7.3" fill="url(#tile-light)"/><g transform="translate(916 390.1) scale(0.610)" filter="url(#icon-shadow)"><g fill="url(#glyph)"><rect x="-26" y="-46" width="52" height="38" rx="6"/><rect x="-55" y="0" width="52" height="38" rx="6"/><rect x="3" y="0" width="52" height="38" rx="6"/></g></g><rect x="754.4" y="309.5" width="253.6" height="192" rx="7.3" fill="none" stroke="#F6FFB0" stroke-opacity="0.35" stroke-width="2"/><rect x="754.4" y="309.5" width="253.6" height="192" rx="7.3" fill="#000" opacity="0.06"/></g><g id="slot-1" filter="url(#slot-shadow)"><rect x="507" y="289.5" width="317" height="240" rx="9.1" fill="url(#tile)"/><rect x="507" y="289.5" width="317" height="240" rx="9.1" fill="url(#tile-light)"/><g transform="translate(668 390.3) scale(0.762)" filter="url(#icon-shadow)"><g fill="none" stroke="url(#glyph)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 -58 C-44 -58 -40 -30 -40 -14 C-40 -4 -46 0 -56 0 C-46 0 -40 4 -40 14 C-40 30 -44 58 -22 58"/><path d="M22 -58 C44 -58 40 -30 40 -14 C40 -4 46 0 56 0 C46 0 40 4 40 14 C40 30 44 58 22 58"/></g></g><text x="529" y="489.5" font-size="24" fill="#FFF" filter="url(#text-shadow)">xsc<tspan x="529" dy="22" font-size="16">SPIR-V to Xenos microcode</tspan></text><rect x="507" y="289.5" width="317" height="240" rx="9.1" fill="none" stroke="#F6FFB0" stroke-opacity="0.35" stroke-width="2"/><rect x="507" y="289.5" width="317" height="240" rx="9.1" fill="#000" opacity="0.03"/></g><g id="slot-0" filter="url(#slot-shadow)"><rect x="96" y="262" width="416" height="315" rx="12" fill="url(#tile)"/><rect x="96" y="262" width="416" height="315" rx="12" fill="url(#tile-light)"/><g clip-path="url(#front-clip)" fill="none" stroke="#FFF"><circle cx="445.4" cy="321.9" r="40" stroke-width="7" opacity="0.17"/><circle cx="445.4" cy="321.9" r="18" stroke-width="5" opacity="0.15"/><circle cx="150.1" cy="334.4" r="26" stroke-width="5" opacity="0.13"/><circle cx="200" cy="510.9" r="13" stroke-width="4" opacity="0.13"/><circle cx="378.9" cy="299.8" r="9" stroke-width="3" opacity="0.14"/><circle cx="491.2" cy="457.3" r="28" stroke-width="4" opacity="0.09"/></g><g filter="url(#icon-shadow)"><circle cx="304" cy="394.3" r="87" fill="#C6DF6E"/><circle cx="304" cy="394.3" r="80" fill="url(#sphere)"/><ellipse cx="280" cy="362.3" rx="24" ry="13.6" fill="#FFF" opacity="0.9" transform="rotate(-35 280 362.3)"/></g><text x="126" y="547" font-size="30" fill="#FFF" filter="url(#text-shadow)">open shader toolchain</text><rect x="96" y="262" width="416" height="315" rx="12" fill="none" stroke="#F6FFB0" stroke-opacity="0.35" stroke-width="2"/></g>
  </g>
</svg>
