<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720"
  font-family="Segoe UI, Selawik, 'Open Sans', sans-serif">
  <title>xsdk</title>
  <defs>
    <!-- The sky and floor of the 2008 dashboard's channels, its colours measured from a capture. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#284607"/>
      <stop offset="0.2" stop-color="#4B7218"/>
      <stop offset="0.42" stop-color="#7E9D4E"/>
      <stop offset="0.58" stop-color="#A2B2A2"/>
      <stop offset="0.7" stop-color="#B2BCB6"/>
    </linearGradient>
    <linearGradient id="haze" x1="300" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8B80" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C8B80" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1280" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9BEC7"/>
      <stop offset="0.45" stop-color="#9297A0"/>
      <stop offset="1" stop-color="#5E6068"/>
    </linearGradient>
    <linearGradient id="floor-shade" x1="0" y1="400" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E4046" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E4046" stop-opacity="0.45"/>
    </linearGradient>
    <!-- A slot: bright lime under its top edge, olive at its foot. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FE9C"/>
      <stop offset="0.04" stop-color="#ECFD72"/>
      <stop offset="0.16" stop-color="#DCFB46"/>
      <stop offset="0.52" stop-color="#9BD815"/>
      <stop offset="0.87" stop-color="#456A13"/>
      <stop offset="1" stop-color="#22350D"/>
    </linearGradient>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0.7" y2="0.8">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1F9D8"/>
      <stop offset="1" stop-color="#D3EA86"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2FAD6"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF7C8"/>
      <stop offset="1" stop-color="#D2E794"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDE380"/>
      <stop offset="1" stop-color="#A9C94A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="430" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflection-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <rect width="1280" height="720" fill="url(#fade)"/>
    </mask>
    <clipPath id="front-clip"><rect x="96" y="262" width="416" height="315" rx="12"/></clipPath>
    <filter id="text-shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E1A04" flood-opacity="0.45"/>
    </filter>
    <!-- Each slot shades the one behind it. -->
    <filter id="slot-shadow" x="-10%" y="-10%" width="125%" height="120%">
      <feDropShadow dx="6" dy="0" stdDeviation="6" flood-color="#18260A" flood-opacity="0.4"/>
    </filter>
    <filter id="icon-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1C2E06" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="470" fill="url(#haze)"/>
  <path d="M0 452 C400 432 900 408 1280 398 V720 H0 Z" fill="url(#floor)"/>
  <path d="M0 452 C400 432 900 408 1280 398 V720 H0 Z" fill="url(#floor-shade)"/>

  <!-- The channel list: the selected channel large, with its square, and the ones above it fading. -->
  <g fill="#FFF">
    <text x="102" y="96" font-size="28" opacity="0.26">vulkan4xenon</text>
    <text x="102" y="141" font-size="38" opacity="0.42">xost</text>
    <g filter="url(#text-shadow)">
      <rect x="78" y="192" width="15" height="15"/>
      <text x="100" y="226" font-size="100" font-weight="600">xsdk</text>
    </g>
  </g>

  <g mask="url(#reflection-fade)">
